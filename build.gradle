// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // تم تصحيح الإصدار إلى إصدار حقيقي
    ext.kotlin_version = '2.0.0' 

    repositories {
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        // تم تصحيح إصدار Android Gradle Plugin إلى 8.6.0
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // تم تحديث إضافة Sentry لتتوافق مع الإصدار الجديد من AGP
        classpath 'io.sentry:sentry-android-gradle-plugin:4.14.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        google()
    }
}

// ✅ هذا الجزء الجديد: إجبار جميع الوحدات الفرعية على استخدام compileSdk 35
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion 35
                buildToolsVersion "35.0.0"
            }
        }
    }
}
