// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // تحديث إصدار Kotlin
    ext.kotlin_version = '2.4.0' 

    repositories {
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        // تحديث AGP إلى 9.1.1 (أول إصدار يدعم API 37)
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        google()
    }
}

// ✅ الحل النهائي والشامل لمعالجة جميع الوحدات الفرعية (Submodules)
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            // 1. إجبار جميع الوحدات على استخدام compileSdk 37
            project.android {
                if (project.android.hasProperty('compileSdkVersion')) {
                    compileSdkVersion 37
                } else {
                    compileSdk 37
                }
            }

            // 2. معالجة ملف AndroidManifest.xml لاستخراج الـ namespace تلقائياً
            def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def manifestContent = manifestFile.getText('UTF-8')
                // البحث عن سطر package="..."
                def matcher = manifestContent =~ /package="([^"]+)"/
                if (matcher.find()) {
                    def pkgName = matcher.group(1)
                    
                    // وضع الاسم كـ namespace في إعدادات Gradle للوحدة
                    if (project.android.hasProperty('namespace')) {
                        project.android.namespace = pkgName
                    }
                    
                    // حذف السطر من المانيفست حتى لا يشتكي النظام
                    manifestContent = manifestContent.replaceAll(/package="[^"]*"/, '')
                    manifestFile.write(manifestContent, 'UTF-8')
                    
                    println "✅ Automatically fixed namespace for ${project.name}: ${pkgName}"
                }
            }
        }
    }
}
