 * Project:  NextGIS Mobile
 * ...
 */

buildscript {
    ext.kotlin_version = '2.4.0' 

    repositories {
        maven { url 'https://maven.google.com/'; name 'Google' }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        google()
    }
}

// ✅ الحل الجذري: معالجة جميع الوحدات الفرعية تلقائياً
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            // 1. إجبار استخدام compileSdk 37
            project.android {
                compileSdkVersion 37
                buildToolsVersion "37.0.0"
            }

            // 2. إزالة package من AndroidManifest.xml تلقائياً
            def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def manifestContent = manifestFile.getText('UTF-8')
                if (manifestContent.contains('package=')) {
                    println "Removing package attribute from ${manifestFile}"
                    manifestContent = manifestContent.replaceAll(/package="[^"]*"/, '')
                    manifestFile.write(manifestContent, 'UTF-8')
                }
            }
        }
    }
}
