name: Build Alameer_Map APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Install Android SDK Platform 37 and create symlink
      run: |
        yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
        yes | sdkmanager --licenses
        ln -s $ANDROID_SDK_ROOT/platforms/android-37.0 $ANDROID_SDK_ROOT/platforms/android-37

    - name: Create dummy local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        validate-wrappers: false

    # ✏️ خطوة 1: تثبيت keystore
    - name: Setup Custom Debug Keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
        echo "✅ Keystore installed"

    # ✏️ خطوة 2: التحقق من SHA-1 للـ keystore
    - name: Verify Keystore SHA-1
      run: |
        echo "=========================================="
        echo "🔑 KEYSTORE SHA-1 (what Firebase should have):"
        echo "=========================================="
        keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1 | grep -i "SHA1:" || echo "❌ FAILED to read keystore!"
        echo ""
        echo "📏 Keystore file size:"
        ls -la ~/.android/debug.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # ✏️ خطوة 3: التحقق من SHA-1 للـ APK النهائي
    - name: Verify APK SHA-1
      run: |
        echo "=========================================="
        echo "📱 APK SHA-1 (what Google sees on your phone):"
        echo "=========================================="
        $ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk 2>&1 | grep -i "SHA-1" || echo "❌ FAILED to read APK signature!"
        echo ""
        echo "📦 APK file:"
        ls -la app/build/outputs/apk/debug/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Alameer_Map-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
