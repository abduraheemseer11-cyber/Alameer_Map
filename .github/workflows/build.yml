name: Build Alameer_Map APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Install Android SDK Platform 37 and create symlink
      run: |
        yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
        yes | sdkmanager --licenses
        ln -s $ANDROID_SDK_ROOT/platforms/android-37.0 $ANDROID_SDK_ROOT/platforms/android-37

    - name: Create dummy local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        validate-wrappers: false

    # ✏️ جديد: استخدام نفس keystore الخاص بك
    - name: Setup Custom Debug Keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
        echo "Keystore installed successfully"
        ls -la ~/.android/debug.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Alameer_Map-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
