name: Build Alameer_Map APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # 1. إعداد Android SDK الأساسي (v4 لا يحاول تثبيت tools المحذوفة)
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools' # تحديد الحزم صراحةً لتجنب tools

    # 2. تثبيت المنصة والأدوات المطلوبة يدوياً عبر sdkmanager
    - name: Install Android SDK Platform 37
      run: |
        sdkmanager "platforms;android-37" "build-tools;37.0.0"
        sdkmanager --licenses

    # 3. إنشاء ملف local.properties
    - name: Create dummy local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        validate-wrappers: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Alameer_Map-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
