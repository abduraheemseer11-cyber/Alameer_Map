name: Build Alameer_Map APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # 1. إعداد Android SDK الأساسي
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    # 2. تثبيت الحزمة بالاسم الصحيح (android-37.0) وإنشاء رابط رمزي
    - name: Install Android SDK Platform 37 and create symlink
      run: |
        yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
        yes | sdkmanager --licenses
        ln -s $ANDROID_SDK_ROOT/platforms/android-37.0 $ANDROID_SDK_ROOT/platforms/android-37

    # 3. إنشاء ملف local.properties
    - name: Create dummy local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    # 4. استخدام JDK 21 كما يتطلب الكود
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        validate-wrappers: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Alameer_Map-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
